name: Deploy demo to GitHub Pages

# A client-facing demo of the rebuild. Pages is static-only: there is no
# serverless runtime, so POST /api/lead does not exist here and the lead form
# degrades to the phone and WhatsApp links. Legacy WordPress URLs are served as
# meta-refresh stubs rather than real 301s — see scripts/deploy/build-pages.ts.

on:
  push:
    branches: [claude/caesar-redesign-kings-api-ketquz]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a superseded run is not worth finishing.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build for Pages
        env:
          # Project site, so the app is served from a subpath.
          PAGES_BASE: /real-es/
        run: npm run build:pages

      # enablement turns Pages on for the repo if it is not already, so this
      # does not need a manual settings change first.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
